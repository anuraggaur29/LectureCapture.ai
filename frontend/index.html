<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LectureCapture — Upload</title>
  <script src="https://js.puter.com/v2/"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #fff; border-radius: 12px; padding: 40px; box-shadow: 0 2px 16px rgba(0,0,0,.08); max-width: 500px; width: 100%; text-align: center; }
    h1 { margin-bottom: 8px; font-size: 1.6rem; }
    p.sub { color: #666; margin-bottom: 24px; font-size: .95rem; }
    input[type="file"] { margin: 16px 0; }
    button { background: #2563eb; color: #fff; border: none; padding: 12px 32px; border-radius: 8px; font-size: 1rem; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #93b5f5; cursor: not-allowed; }
    #status { margin-top: 16px; font-weight: 500; min-height: 24px; }
    .step { color: #555; font-size: .9rem; margin-top: 8px; }
    a.hist { display: inline-block; margin-top: 20px; color: #2563eb; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📘 LectureCapture</h1>
    <p class="sub">Upload a lecture recording → get structured notes</p>
    <form id="upload-form">
      <input type="file" id="audio" accept="audio/*,video/*" required /><br />
      <button type="submit" id="btn">Upload & Process</button>
    </form>
    <div id="status"></div>
    <div id="step" class="step"></div>
    <a class="hist" href="/history">📜 View History</a>
  </div>
  <script src="/static/upload.js"></script>
</body>
</html>
